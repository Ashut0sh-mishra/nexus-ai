# Development docker compose. For production, layer docker-compose.prod.yml on top:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# All sensitive values default to dev-only fallbacks but can (and should) be
# overridden in a .env file at the repo root.

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    # Only expose to the loopback in dev; production override drops this.
    # Override POSTGRES_HOST_PORT in .env if 5432 is taken on the host.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    # Override REDIS_HOST_PORT in .env if 6379 is taken on the host (e.g. Memurai).
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexus-ai/backend:dev
    container_name: nexus-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nexus}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      MEMORY_DIR: /app/storage/.memory
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount source for hot reload (dev only). Production override drops this.
      - ./backend:/app
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks: [internal]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexus-ai/backend:dev
    container_name: nexus-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nexus}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      MEMORY_DIR: /app/storage/.memory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    networks: [internal]

  frontend:
    image: node:20-alpine
    container_name: nexus-frontend
    working_dir: /app
    environment:
      # Inside the compose network, the backend is reachable as `backend:8000`.
      # Vite's dev proxy uses this to forward /api/* to the backend container.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  frontend_node_modules:

networks:
  internal:
    driver: bridge
