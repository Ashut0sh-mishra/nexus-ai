version: "3.9"

# Explicit project name so this folder never collides with sibling clones
# (e.g. D:\nexus-ai-gh). Override with env var COMPOSE_PROJECT_NAME if needed.
name: nexus-ai-1

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    shm_size: "2gb"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    shm_size: "2gb"
    working_dir: /app
    command: celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=2

  frontend:
    image: node:20-alpine
    container_name: nexus-frontend
    working_dir: /app
    environment:
      BACKEND_PROXY_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_storage:
